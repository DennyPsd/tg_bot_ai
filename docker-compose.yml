version: '3.8'

services:
  bot_tg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot
    restart: unless-stopped
    
    # Переменные окружения для бота
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - MODEL=${MODEL:-gpt-3.5-turbo}
      - PASS_GM=${PASS_GM}
      - RUST_LOG=info
    
    # Монтирование .env файла (опционально)
    env_file:
      - .env
    
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Логи
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "./bot_tg", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

