name: Deploy to VPS

on:
  push:
    branches:
      - master  # или другая ветка, на которой вы хотите запускать деплой

env:
  CARGO_TERM_COLOR: always
  APP_NAME: bot_tg
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  TARGET_DIR: /root/deployment/bot_tg  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked

      # Проверяем, что бинарник действительно появился
      - name: Check binary
        run: |
          ls -la target/release/
          if [ ! -f target/release/${{ env.APP_NAME }} ]; then
            echo "Binary ${{ env.APP_NAME }} not found!"
            exit 1
          fi

      # Устанавливаем SSH-ключи
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Debug
        run: |
          echo "VPS_HOST: ${{ env.VPS_HOST }}"
          echo "VPS_USER: ${{ env.VPS_USER }}"

      # Копируем бинарник на VPS
      - name: Copy binary to VPS
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'mkdir -p ${{ env.TARGET_DIR }}'
          scp -P ${{ env.VPS_PORT || 22 }} -o StrictHostKeyChecking=no \
            target/release/${{ env.APP_NAME }} \
            -o UserKnownHostsFile=/dev/null \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.TARGET_DIR }}/app \
          'echo -e "TG_TOKEN=${{ secrets.TG_TOKEN }}\nAPI_TOKEN=${{ secrets.API_TOKEN }}\nMODEL=${{ secrets.MODEL }}\nPASS_GM=${{ secrets.PASS_GM }}" > ${{ env.TARGET_DIR }}/.env'


      # Опционально: перезапускаем systemd-сервис
      - name: Restart service on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo systemctl stop ${{ env.APP_NAME }}.service || true'
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo cp ${{ env.TARGET_DIR }}/app /usr/local/bin/${{ env.APP_NAME }}'
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo systemctl start ${{ env.APP_NAME }}.service'