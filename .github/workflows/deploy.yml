name: Deploy to VPS

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      
env:
  CARGO_TERM_COLOR: always
  APP_NAME: bot_tg
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  MODEL: ${{ secrets.MODEL }}
  PASS_GM: ${{ secrets.PASS_GM }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TARGET_DIR: /root/deployment/bot_tg  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |        
          cargo build --release --locked

      - name: Check binary
        run: |
          ls -la target/release/
          if [ ! -f target/release/${{ env.APP_NAME }} ]; then
            echo "Binary ${{ env.APP_NAME }} not found!"
            exit 1
          fi
  
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Create .env file on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'mkdir -p ${{ env.TARGET_DIR }} && cat > ${{ env.TARGET_DIR }}/.env << "EOF"
          TG_TOKEN=${{ secrets.TG_TOKEN }}
          API_TOKEN=${{ secrets.API_TOKEN }}
          MODEL=${{ secrets.MODEL }}
          PASS_GM=${{ secrets.PASS_GM }}
          EOF'

      - name: Copy binary to VPS
        run: |
          scp -P ${{ env.VPS_PORT || 22 }} -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            target/release/${{ env.APP_NAME }} \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.TARGET_DIR }}/app


      - name: Restart service on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo systemctl stop ${{ env.APP_NAME }}.service || true'
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo cp ${{ env.TARGET_DIR }}/app /usr/local/bin/${{ env.APP_NAME }}'
          ssh -o StrictHostKeyChecking=no -p ${{ env.VPS_PORT || 22 }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            'sudo systemctl start ${{ env.APP_NAME }}.service'